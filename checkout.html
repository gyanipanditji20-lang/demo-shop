<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Demo Shop - Checkout</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header>
    <span class="brand">🛒 Demo Shop</span>
    <nav><a href="search.html">Products</a><a href="checkout.html">Checkout</a></nav>
  </header>
  <main>
    <h1>Checkout</h1>
    <div class="card">
      <div class="summary-row"><span>💻 Laptop</span><span>$60</span></div>
      <div class="summary-row"><span>🎧 Headphones</span><span>$40</span></div>
      <p id="total">Total: $100</p>
      <button id="place-order">Place Order</button>
      <p id="order-msg"></p>
    </div>
  </main>
  <script>
    document.getElementById('place-order').onclick = () => {
      document.getElementById('order-msg').textContent = 'Order placed!';
    };
  </script>
</body>
</html>
