name: run-tests
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Space-separated test files, or all"
        required: true
        default: "all"

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run selected tests
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          if [ "$TESTS" = "all" ]; then
            npx playwright test
          else
            npx playwright test $TESTS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
