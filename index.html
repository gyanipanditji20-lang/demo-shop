<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Demo Shop - Login</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Demo Shop Login</h1>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="login-btn">Login</button>
  <p id="login-error" style="color:red"></p>
  <script>
    document.getElementById('login-btn').onclick = () => {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      if (e === 'qa@test.com' && p === 'pass123') { location.href = 'search.html'; }
      else { document.getElementById('login-error').textContent = 'Invalid credentials'; }
    };
  </script>
</body>
</html>
