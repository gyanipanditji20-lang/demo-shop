<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Demo Shop - Search</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Search Products</h1>
  <input id="search-box" placeholder="Search products">
  <button id="search-btn">Search</button>
  <ul id="results"></ul>
  <p id="no-results"></p>
  <a id="goto-checkout" href="checkout.html">Go to checkout</a>
  <script>
    const products = ['Laptop', 'Phone', 'Headphones'];
    document.getElementById('search-btn').onclick = () => {
      const q = document.getElementById('search-box').value.toLowerCase();
      const found = products.filter(p => p.toLowerCase().includes(q));
      document.getElementById('results').innerHTML = found.map(p => `<li>${p}</li>`).join('');
      document.getElementById('no-results').textContent = found.length ? '' : 'No products found';
    };
  </script>
</body>
</html>
